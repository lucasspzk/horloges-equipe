<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team clocks</title>
<meta name="description" content="Live local time of every team member, to embed in Notion with an /embed block.">
<!--
  ─────────────────────────────────────────────────────────────
  HORLOGES ÉQUIPE — page à embarquer dans Notion (/embed + URL)
  ─────────────────────────────────────────────────────────────
  À modifier : uniquement le bloc TEAM ci-dessous (un objet par personne).
    name     : prénom
    country  : pays affiché sous le prénom (en anglais)
    city     : ville, affichée dans la timeline avant le pays (optionnel)
    tz       : fuseau IANA, ex. "Europe/Paris", "America/Los_Angeles", "Asia/Makassar"
               (liste : https://en.wikipedia.org/wiki/List_of_tz_database_time_zones)
    hours    : [début, fin] des horaires de dispo, en heures locales (optionnel, défaut 9 → 18)
    days     : jours travaillés, 1 = lundi … 7 = dimanche (optionnel, défaut lun → ven)

  Les cartes sont triées par heure locale croissante (de l'ouest vers l'est), re-triées
  automatiquement si un changement d'heure modifie l'ordre. Textes affichés en anglais.

  Sous les cartes : une timeline de 24 h par personne, alignée sur l'instant présent du lecteur
  (repère « Now »), fenêtre de 8 h en arrière à 16 h en avant. Couleurs par heure locale :
  nuit (22h → 6h) bleu foncé, tôt le matin / tard le soir bleu clair, horaires de dispo vert clair
  (jamais de vert le week-end). Réglage de la nuit : NIGHT ci-dessous.

  Paramètre d'URL (optionnel) :
    ?cols=3          → force 3 colonnes
-->
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --border: #e6e6e3;
    --text: #37352f;
    --muted: #787774;
    --ok: #1c6b46;  --ok-bg: #dbeddb;
    --off: #6b6b68; --off-bg: #ededeb;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.35;
    padding: 12px 16px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px 12px;
    display: flex; flex-direction: column; gap: 10px;
    min-width: 0;
  }

  .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .country { color: var(--muted); font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .time {
    font-size: 36px; font-weight: 600; line-height: 1;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: baseline; gap: 8px;
  }
  .time .sky { font-size: 18px; margin-left: auto; }

  .meta { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
  .meta .diff { font-variant-numeric: tabular-nums; }

  .pill {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500;
    padding: 3px 9px; border-radius: 999px;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok  { color: var(--ok);  background: var(--ok-bg); }
  .pill.off { color: var(--off); background: var(--off-bg); }

  /* ───────── Timeline ───────── */
  :root {
    --tl-label: 200px;
    --night: #2b3f63;  --night-text: #d6e0f0;  --night-deep: #1f3050;
    --edge: #dbe7f7;   --edge-text: #3b5a8a;
    --work: #d2efd9;   --work-text: #1c6b46;
    --now: #37352f;
  }
  .timeline { margin-top: 22px; }
  .tl-head {
    display: grid; grid-template-columns: var(--tl-label) 1fr; gap: 14px;
    height: 22px; margin-bottom: 6px;
  }
  .tl-axis { position: relative; }
  .now-pill {
    position: absolute; top: 0; transform: translateX(-50%);
    font-size: 11px; font-weight: 600; color: #fff; background: var(--now);
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .tl-row {
    display: grid; grid-template-columns: var(--tl-label) 1fr; gap: 14px;
    align-items: center; padding: 9px 0;
    border-top: 1px solid var(--border);
  }
  .tl-row:first-child { border-top: 0; }
  .tl-who { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-width: 0; }
  .tl-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-name .off { font-weight: 500; font-size: 11px; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .tl-place { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-time { text-align: right; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .tl-time .t { font-weight: 600; font-size: 16px; line-height: 1.2; }
  .tl-time .d { color: var(--muted); font-size: 11px; }
  .tl-strip {
    position: relative; display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px;
    height: 40px;
  }
  .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 11px; font-weight: 500; line-height: 1; border-radius: 4px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.2px; overflow: hidden;
  }
  .cell:first-child { border-radius: 8px 4px 4px 8px; }
  .cell:last-child { border-radius: 4px 8px 8px 4px; }
  .cell small { font-size: 8px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; opacity: .85; white-space: nowrap; }
  .cell.night { background: var(--night); color: var(--night-text); }
  .cell.night.day0 { background: var(--night-deep); }
  .cell.edge  { background: var(--edge);  color: var(--edge-text); }
  .cell.work  { background: var(--work);  color: var(--work-text); }
  .now-line {
    position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 2px;
    background: var(--now); transform: translateX(-50%); pointer-events: none;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; color: var(--muted); font-size: 11px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  @media (max-width: 760px) {
    :root { --tl-label: 170px; }
    .tl-head, .tl-row { gap: 10px; }
    .cell { font-size: 10px; letter-spacing: -0.3px; }
    .cell small { font-size: 7px; }
  }
  @media (max-width: 560px) {
    :root { --tl-label: 140px; }
    .tl-strip { height: 26px; gap: 1px; }
    .cell { font-size: 0; }
    .cell small { display: none; }
    .tl-time .t { font-size: 14px; }
  }
  @media (max-width: 400px) {
    body { padding: 10px 12px 12px; }
    .grid { grid-template-columns: 1fr; }
    :root { --tl-label: 120px; }
    .tl-time .d { display: none; }
  }
</style>
</head>
<body>

<div class="grid" id="grid"></div>

<section class="timeline">
  <div class="tl-head"><div></div><div class="tl-axis"><span class="now-pill" id="nowPill"></span></div></div>
  <div id="tlRows"></div>
  <div class="legend">
    <span><i style="background:var(--night)"></i>Night</span>
    <span><i style="background:var(--edge)"></i>Early / late</span>
    <span><i style="background:var(--work)"></i>Available</span>
    <span>Times shown in each person's local time</span>
  </div>
</section>

<script>
  // ───────────── ÉQUIPE ─────────────
  const TEAM = [
    { name: "Lucas",   country: "United States", tz: "America/Los_Angeles" },
    { name: "Nathan",  country: "Bali",          tz: "Asia/Makassar" },
    { name: "Justine", country: "France",        tz: "Europe/Paris" },
    { name: "Illan",   country: "France",        tz: "Europe/Paris" },
    { name: "Pedro",   country: "Brazil",        tz: "America/Sao_Paulo" },
    { name: "Johanna", country: "Romania",       tz: "Europe/Bucharest" },
  ];
  const DEFAULT_HOURS = [9, 18];
  const DEFAULT_DAYS = [1, 2, 3, 4, 5];
  const NIGHT = [22, 6];          // bleu foncé de 22h à 6h
  const WINDOW_BEFORE_H = 8;      // la timeline commence 8 h avant maintenant
  // ───────────────────────────────────

  const params = new URLSearchParams(location.search);
  const grid = document.getElementById("grid");
  const cols = parseInt(params.get("cols"), 10);
  if (cols > 0) grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

  // Formatters mis en cache par fuseau (évite de les recréer chaque seconde)
  const fmtCache = new Map();
  function fmt(tz) {
    if (!fmtCache.has(tz)) {
      fmtCache.set(tz, {
        parts: new Intl.DateTimeFormat("en-US", {
          timeZone: tz, hourCycle: "h23",
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short",
        }),
        date: new Intl.DateTimeFormat("en-GB", { timeZone: tz, weekday: "long", day: "numeric", month: "long" }),
        dateShort: new Intl.DateTimeFormat("en-GB", { timeZone: tz, weekday: "short", day: "numeric", month: "short" }),
      });
    }
    return fmtCache.get(tz);
  }

  const WEEKDAY = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };

  function rawParts(date, tz) {
    return Object.fromEntries(fmt(tz).parts.formatToParts(date).map(x => [x.type, x.value]));
  }

  function localParts(date, tz) {
    const p = rawParts(date, tz);
    const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
    return {
      hour: +p.hour, minute: +p.minute,
      weekday: WEEKDAY[p.weekday],
      offsetMin: Math.round((asUTC - date.getTime()) / 60000),
    };
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  function diffLabel(memberOffset, viewerOffset) {
    const d = memberOffset - viewerOffset;
    if (d === 0) return "Same time as you";
    const h = Math.floor(Math.abs(d) / 60), m = Math.abs(d) % 60;
    return `${h}h${m ? pad(m) : ""} ${d > 0 ? "ahead of" : "behind"} you`;
  }

  function status(m, lp) {
    const days = m.days || DEFAULT_DAYS;
    const [start, end] = m.hours || DEFAULT_HOURS;
    const t = lp.hour + lp.minute / 60;
    const inHours = start < end ? (t >= start && t < end) : (t >= start || t < end);
    if (!days.includes(lp.weekday)) return { cls: "off", label: "Weekend" };
    if (inHours) return { cls: "ok", label: "Available" };
    return { cls: "off", label: "Off hours" };
  }

  // Couleur d'une heure pleine de la timeline : nuit, tôt/tard, ou dispo (jamais dispo le week-end)
  function band(m, hour, weekday) {
    if (hour >= NIGHT[0] || hour < NIGHT[1]) return "night";
    const days = m.days || DEFAULT_DAYS;
    const [start, end] = m.hours || DEFAULT_HOURS;
    const inHours = start < end ? (hour >= start && hour < end) : (hour >= start || hour < end);
    return (days.includes(weekday) && inHours) ? "work" : "edge";
  }

  function offsetShort(memberOffset, viewerOffset) {
    const d = memberOffset - viewerOffset;
    if (d === 0) return "";
    const h = Math.floor(Math.abs(d) / 60), m = Math.abs(d) % 60;
    return `${d > 0 ? "+" : "−"}${h}h${m ? pad(m) : ""}`;
  }

  // Construction des cartes (une fois), puis mise à jour des valeurs chaque minute
  const cards = TEAM.map(m => {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div><div class="name"></div><div class="country"></div></div>
      <div class="time"><span class="hm"></span><span class="sky"></span></div>
      <div class="meta"><span class="date"></span><span class="diff"></span></div>
      <span class="pill"></span>`;
    card.querySelector(".name").textContent = m.name;
    card.querySelector(".country").textContent = m.country;

    // Rangée de timeline correspondante
    const row = document.createElement("div");
    row.className = "tl-row";
    row.innerHTML = `
      <div class="tl-who">
        <div><div class="tl-name"><span class="n"></span><span class="off"></span></div><div class="tl-place"></div></div>
        <div class="tl-time"><div class="t"></div><div class="d"></div></div>
      </div>
      <div class="tl-strip"><div class="now-line"></div></div>`;
    row.querySelector(".tl-name .n").textContent = m.name;
    row.querySelector(".tl-place").textContent = [m.city, m.country].filter(Boolean).join(", ");
    const strip = row.querySelector(".tl-strip");
    const nowLine = row.querySelector(".now-line");
    const cells = [];
    for (let i = 0; i < 24; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      strip.insertBefore(cell, nowLine);
      cells.push(cell);
    }

    return {
      m, card, row, cells, nowLine,
      hm: card.querySelector(".hm"), sky: card.querySelector(".sky"),
      date: card.querySelector(".date"), diff: card.querySelector(".diff"), pill: card.querySelector(".pill"),
      tlOff: row.querySelector(".tl-name .off"), tlT: row.querySelector(".tl-time .t"), tlD: row.querySelector(".tl-time .d"),
    };
  });

  const tlRows = document.getElementById("tlRows");
  const nowPill = document.getElementById("nowPill");
  const viewerHM = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit" });

  // Ordre chronologique : heure locale croissante (ouest → est). Stable : à décalage égal, ordre de TEAM.
  let currentOrder = "";
  function sortCards() {
    const sorted = cards.slice().sort((a, b) => a.offsetMin - b.offsetMin);
    const key = sorted.map(c => c.m.name).join("|");
    if (key !== currentOrder) {
      currentOrder = key;
      for (const c of sorted) { grid.appendChild(c.card); tlRows.appendChild(c.row); }
    }
  }

  // Timeline : 24 cases par personne, une par heure du lecteur, de 8 h avant à 16 h après maintenant.
  // Arithmétique en UTC (pas de setHours) pour rester juste les jours de changement d'heure.
  function renderTimeline(now) {
    const start = Math.floor(now.getTime() / 3600000) * 3600000 - WINDOW_BEFORE_H * 3600000;
    const frac = (now.getTime() - start) / 86400000;
    const left = `${(frac * 100).toFixed(3)}%`;
    nowPill.style.left = left;
    nowPill.textContent = `Now · ${viewerHM.format(now)}`;

    for (const c of cards) {
      c.nowLine.style.left = left;
      for (let i = 0; i < 24; i++) {
        const p = rawParts(new Date(start + i * 3600000), c.m.tz);
        const hour = +p.hour, weekday = WEEKDAY[p.weekday];
        const label = p.minute === "00" ? String(hour) : `${hour}:${p.minute}`;
        const cell = c.cells[i];
        cell.className = `cell ${band(c.m, hour, weekday)}${hour === 0 ? " day0" : ""}`;
        // À minuit : jour + numéro du jour (ex. « TUE / 3 ») à la place de l'heure, case plus foncée
        cell.innerHTML = hour === 0
          ? `<small>${p.weekday}</small><span>${+p.day}</span>`
          : `<span>${label}</span>`;
      }
    }
  }

  function tick() {
    const now = new Date();
    const viewerOffset = -now.getTimezoneOffset();
    for (const c of cards) {
      const lp = localParts(now, c.m.tz);
      c.offsetMin = lp.offsetMin;
      c.hm.textContent = `${pad(lp.hour)}:${pad(lp.minute)}`;
      c.sky.textContent = (lp.hour >= 7 && lp.hour < 20) ? "☀️" : "🌙";
      c.date.textContent = fmt(c.m.tz).date.format(now);
      c.diff.textContent = diffLabel(lp.offsetMin, viewerOffset);
      const s = status(c.m, lp);
      c.pill.className = `pill ${s.cls}`;
      c.pill.textContent = s.label;
      c.tlT.textContent = `${pad(lp.hour)}:${pad(lp.minute)}`;
      c.tlD.textContent = fmt(c.m.tz).dateShort.format(now);
      c.tlOff.textContent = offsetShort(lp.offsetMin, viewerOffset);
    }
    sortCards();
    renderTimeline(now);
  }

  tick();
  // Aligne les mises à jour sur le changement de minute (l'affichage n'a pas de secondes)
  setTimeout(() => { tick(); setInterval(tick, 60000); }, 60000 - (Date.now() % 60000) + 50);
</script>
</body>
</html>
